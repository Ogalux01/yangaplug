<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        canvas {
            background: #eee;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <h1>Pong Game</h1>
    <canvas id="pongCanvas" width="800" height="400"></canvas>
    <h3>Score: <span id="score">0</span></h3>
    <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
    </select>
    <script>
        const canvas = document.getElementById('pongCanvas');
        const context = canvas.getContext('2d');
        let playerScore = 0, aiScore = 0;
        let paddleHeight = 100, paddleY = 150;
        let ballX = canvas.width / 2, ballY = canvas.height / 2, ballSpeedX = 5, ballSpeedY = 2;

        function draw() {
            context.clearRect(0, 0, canvas.width, canvas.height);
            drawPaddle();
            drawBall();
            drawScore();
            moveBall();
            requestAnimationFrame(draw);
        }

        function drawPaddle() {
            context.fillStyle = '#333';
            context.fillRect(10, paddleY, 10, paddleHeight);
        }

        function drawBall() {
            context.fillStyle = '#333';
            context.beginPath();
            context.arc(ballX, ballY, 10, 0, Math.PI * 2, false);
            context.fill();
        }

        function drawScore() {
            document.getElementById('score').innerText = playerScore;
        }

        function moveBall() {
            ballX += ballSpeedX;
            ballY += ballSpeedY;
            if(ballY < 0 || ballY > canvas.height) {
                ballSpeedY = -ballSpeedY;
            }
            if(ballX < 0) {
                playerScore++;
                resetBall();
            }
        }

        function resetBall() {
            ballX = canvas.width / 2;
            ballY = canvas.height / 2;
        }

        // Touch control support
        let touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            let touchY = e.touches[0].clientY;
            let touchDiff = touchY - touchStartY;
            paddleY += touchDiff;
            touchStartY = touchY;

            // Keep paddle within canvas bounds
            if (paddleY < 0) paddleY = 0;
            if (paddleY > canvas.height - paddleHeight) paddleY = canvas.height - paddleHeight;
        });

        canvas.addEventListener('touchend', () => {
            // Optional: handle touchend
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') {
                paddleY -= 20;
            } else if (e.key === 'ArrowDown') {
                paddleY += 20;
            }

            // Keep paddle within canvas bounds
            if (paddleY < 0) paddleY = 0;
            if (paddleY > canvas.height - paddleHeight) paddleY = canvas.height - paddleHeight;
        });

        draw();
    </script>
</body>
</html>
