<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
            margin: 0;
        }
        canvas {
            border: 1px solid white;
        }
    </style>
</head>
<body>
    <canvas id="pong" width="800" height="400"></canvas>
    <script>
        const canvas = document.getElementById('pong');
        const context = canvas.getContext('2d');

        // Create the pong paddle
        const paddleWidth = 10;
        const paddleHeight = 100;
        let playerPaddle = { x: 0, y: canvas.height / 2 - paddleHeight / 2, width: paddleWidth, height: paddleHeight, color: '#00FF00', dy: 0 };
        let aiPaddle = { x: canvas.width - paddleWidth, y: canvas.height / 2 - paddleHeight / 2, width: paddleWidth, height: paddleHeight, color: '#FF0000', dy: 0 };

        // Create the pong ball
        const ballRadius = 10;
        let ball = { x: canvas.width / 2, y: canvas.height / 2, radius: ballRadius, speed: 5, dx: 5, dy: 5 };

        // Score
        let playerScore = 0;
        let aiScore = 0;

        // Event listeners for paddle movement
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowUp') playerPaddle.dy = -5;
            if (event.key === 'ArrowDown') playerPaddle.dy = 5;
        });

        document.addEventListener('keyup', (event) => {
            if (event.key === 'ArrowUp' || event.key === 'ArrowDown') playerPaddle.dy = 0;
        });

        // Game loop
        function gameLoop() {
            // Move paddles
            playerPaddle.y += playerPaddle.dy;
            aiPaddle.y += (ball.y - (aiPaddle.y + aiPaddle.height / 2)) * 0.1;

            // Ball movement
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Ball wall collision
            if (ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) {
                ball.dy *= -1;
            }

            // Ball paddle collision
            if (ball.x - ball.radius < playerPaddle.x + playerPaddle.width && ball.y > playerPaddle.y && ball.y < playerPaddle.y + playerPaddle.height) {
                ball.dx *= -1;
                ball.x = playerPaddle.x + playerPaddle.width + ball.radius;
            }
            if (ball.x + ball.radius > aiPaddle.x && ball.y > aiPaddle.y && ball.y < aiPaddle.y + aiPaddle.height) {
                ball.dx *= -1;
                ball.x = aiPaddle.x - ball.radius;
            }

            // Scoring
            if (ball.x + ball.radius < 0) {
                aiScore++;
                resetBall();
            } else if (ball.x - ball.radius > canvas.width) {
                playerScore++;
                resetBall();
            }

            // Clear canvas
            context.clearRect(0, 0, canvas.width, canvas.height);

            // Draw paddles
            context.fillStyle = playerPaddle.color;
            context.fillRect(playerPaddle.x, playerPaddle.y, playerPaddle.width, playerPaddle.height);
            context.fillStyle = aiPaddle.color;
            context.fillRect(aiPaddle.x, aiPaddle.y, aiPaddle.width, aiPaddle.height);

            // Draw ball
            context.fillStyle = 'white';
            context.beginPath();
            context.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            context.fill();

            // Draw scores
            context.fillText('Player: ' + playerScore, 50, 50);
            context.fillText('AI: ' + aiScore, canvas.width - 100, 50);

            requestAnimationFrame(gameLoop);
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx *= -1;
        }

        gameLoop();
    </script>
</body>
</html>
