<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Google Accounts</title>
  <link rel="icon" href="https://accounts.google.com/favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Roboto, Arial, sans-serif;
      background: #f5f5f5;
      color: #202124;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 10px rgba(60,64,67,.15);
      max-width: 400px;
      width: 100%;
      padding: 40px 32px 32px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      margin-bottom: 32px;
    }
    .logo img {
      width: 75px;
      height: auto;
    }
    h1 {
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      font-size: 16px;
      color: #5f6368;
      margin-bottom: 24px;
      text-align: center;
    }
    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .input {
      width: 100%;
      padding: 14px 12px;
      font-size: 16px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      outline: none;
      background: #fff;
      transition: border-color .2s;
    }
    .input:focus {
      border-color: #4285f4;
      box-shadow: 0 1px 2px rgba(66,133,244,.08);
    }
    .forgot {
      text-align: right;
      margin-bottom: 8px;
    }
    .forgot a {
      color: #4285f4;
      text-decoration: none;
      font-size: 14px;
    }
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .btn {
      background: #4285f4;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s;
    }
    .btn:hover {
      background: #357ae8;
    }
    .create {
      background: none;
      color: #4285f4;
      border: none;
      font-size: 16px;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }
    .footer {
      margin-top: 32px;
      font-size: 13px;
      color: #5f6368;
      text-align: center;
    }
    @media (max-width: 500px) {
      .container {
        padding: 24px 8px 16px 8px;
        border-radius: 0;
        box-shadow: none;
      }
      .logo img {
        width: 56px;
      }
      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="goo_gle.png" alt="Google">
    </div>
    <h1>Sign in</h1>
    <div class="subtitle">to continue to Google</div>
    <form>
      <input class="input" type="text" placeholder="Email or phone" required>
      <div class="forgot"><a href="#">Forgot email?</a></div>
      <input class="input" type="password" placeholder="Enter your password" required>
      <div class="forgot"><a href="#">Forgot password?</a></div>
      <div class="actions">
        <button type="button" class="create">Create account</button>
        <a href="https://accounts.google.com"><button type="submit" class="btn">Next</button></a>
      </div>
    </form>
    <div class="footer">Not your phone? Use Guest mode to sign in privately. <a href="https://accounts.google.com" style="color:#4285f4;text-decoration:none">Learn more</a></div>
  </div>
</body>
</html>
