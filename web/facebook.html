<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Log in or Sign up</title>
    <link rel="icon" href="face_img/favicon.ico" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            color: #1c1e21;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .content {
            display: flex;
            align-items: center;
            max-width: 1000px;
            width: 100%;
            gap: 40px;
        }

        .left-section {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .facebook-logo {
            margin: -28px;
            max-width: 300px;
        }

        .tagline {
            font-size: 28px;
            line-height: 32px;
            width: 500px;
            padding: 0 0 20px;
        }

        .login-container {
            flex: 1;
            max-width: 396px;
        }

        .login-box {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
            padding: 20px;
            max-width: 396px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            font-size: 17px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            margin-bottom: 12px;
            outline: none;
        }

        .input-field:focus {
            border-color: #1877f2;
            box-shadow: 0 0 0 2px #e7f3ff;
        }

        .login-button {
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 20px;
            font-weight: bold;
            padding: 14px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .forgot-password {
            text-align: center;
            margin: 16px 0;
        }

        .forgot-password a {
            color: #1877f2;
            text-decoration: none;
            font-size: 14px;
        }

        .divider {
            border-bottom: 1px solid #dadde1;
            margin: 20px 0;
        }

        .create-account {
            background-color: #42b72a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            padding: 14px 16px;
            cursor: pointer;
            display: block;
            margin: 0 auto;
        }

        .create-page {
            text-align: center;
            margin-top: 28px;
            font-size: 14px;
        }

        .create-page a {
            color: #1c1e21;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 900px) {
            .content {
                flex-direction: column;
                text-align: center;
            }

            .left-section {
                align-items: center;
            }

            .tagline {
                width: auto;
                font-size: 24px;
            }

            .login-container {
                width: 100%;
            }

            .facebook-logo {
                margin: -18px;
                max-width: 240px;
            }
        }

        @media (max-width: 450px) {
            .container {
                padding: 0;
            }

            .login-box {
                border-radius: 0;
                box-shadow: none;
            }

            .facebook-logo {
                max-width: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="left-section">
                <img src="face_book.png" alt="Facebook" class="facebook-logo">
                <h2 class="tagline">Facebook helps you connect and share with the people in your life.</h2>
            </div>
            <div class="login-container">
                <div class="login-box">
                    <form>
                        <input type="text" class="input-field" placeholder="Email address or phone number">
                        <input type="password" class="input-field" placeholder="Password">
                        <a href="https://web.facebook.com"><button type="submit" class="login-button">Log In</button></a>
                        <div class="forgot-password">
                            <a href="https://web.facebook.com">Forgotten password?</a>
                        </div>
                        <div class="divider"></div>
                        <button type="button" class="create-account">Create New Account</button>
                    </form>
                </div>
                <div class="create-page">
                    <a href="https://web.facebook.com">Create a Page</a> for a celebrity, brand or business.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
